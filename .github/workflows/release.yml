name: Build & release Windows installer

on:
  push:
    branches:
      - main
      - "release/**"
      - feat/media-openrouter-provider
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2
        shell: pwsh

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: pwsh

      - name: Capture base version + stamp packaged version with CI build number
        id: stamp
        # The auto-updater compares the GitHub Release tag (e.g. "v0.8.0-9")
        # against `app.getVersion()`. Without this step the package.json
        # version is just "0.8.0" and every release looks "newer", which
        # causes a relentless update prompt on every app launch. Setting
        # the version to "0.8.0-${run_number}" makes them line up.
        # We also export the *base* version so the later release-tag step
        # produces a clean "v0.8.0-9" tag, not "v0.8.0-9-9".
        run: |
          $pkgPath = "apps/packaged/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $base = $pkg.version
          $stamped = "$base-${{ github.run_number }}"
          $pkg.version = $stamped
          $pkg | ConvertTo-Json -Depth 100 | Set-Content $pkgPath -Encoding utf8
          echo "base=$base" >> $env:GITHUB_OUTPUT
          echo "stamped=$stamped" >> $env:GITHUB_OUTPUT
          Write-Host "Base version: $base; stamped: $stamped"
        shell: pwsh

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          Write-Host "NSIS installed."
        shell: pwsh

      - name: Pre-create NSIS Persian language alias
        # tools-pack's ensureNsisPersianLanguageAlias would otherwise try to
        # write into Program Files at build time. Pre-creating the files
        # with the exact bytes the function expects skips that step.
        # The JS is written to a temp .cjs file because escaping backslashes
        # through PowerShell + node -e is unreliable (paths get mangled).
        run: |
          $nsisDir = "C:\Program Files (x86)\NSIS\Contrib\Language files"
          if (-not (Test-Path "$nsisDir\Farsi.nsh")) {
            Write-Error "NSIS Farsi.nsh not found at $nsisDir — choco install nsis failed?"
            exit 1
          }
          Copy-Item "$nsisDir\Farsi.nlf" "$nsisDir\Persian.nlf" -Force
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'C:/Program Files (x86)/NSIS/Contrib/Language files';
          const farsi = fs.readFileSync(path.join(dir, 'Farsi.nsh'), 'utf8');
          const persian = farsi.replace('LANGFILE "Farsi"', 'LANGFILE "Persian"');
          fs.writeFileSync(path.join(dir, 'Persian.nsh'), persian, 'utf8');
          console.log('Persian.nsh written, length:', persian.length);
          '@ | Out-File -FilePath persian-alias.cjs -Encoding utf8
          node persian-alias.cjs
          Remove-Item persian-alias.cjs
        shell: pwsh

      - name: Build NSIS installer (portable, no baked paths)
        # The --portable flag tells tools-pack to skip baking the runtime's
        # build-machine namespace path into open-design-config.json, so the
        # installed app falls through to the default Electron userData path
        # on the user's machine.
        run: pnpm tools-pack win build --to nsis --portable
        shell: pwsh
        env:
          # electron-builder reads GH_TOKEN for the github publish provider
          # (informational only — we don't use auto-publish, we upload via
          # softprops/action-gh-release below for clearer control).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        # Use the BASE version (e.g. "0.8.0") captured before the stamp step;
        # the tag suffix is the run number alone, so tags look like
        # "v0.8.0-9" instead of the doubled "v0.8.0-9-9".
        run: |
          echo "version=${{ steps.stamp.outputs.base }}" >> $env:GITHUB_OUTPUT
          Write-Host "Base app version (for tag): ${{ steps.stamp.outputs.base }}"
        shell: pwsh

      - name: List build artifacts
        run: Get-ChildItem ".tmp/tools-pack/out/win/namespaces/default/builder/" -File | Format-Table Name, Length
        shell: pwsh

      - name: Package win-unpacked as ZIP for SAC-bypass installs
        # Windows 11 Smart App Control blocks unsigned .exe installers.
        # We work around that by also shipping the un-packed app as a
        # plain ZIP — users (or the auto-updater) can extract it directly
        # over %LOCALAPPDATA%\Programs\Open Design\ without ever running
        # an unsigned executable, which bypasses SAC entirely.
        run: |
          $unpackedDir = ".tmp/tools-pack/out/win/namespaces/default/builder/win-unpacked"
          $zipPath = ".tmp/tools-pack/out/win/namespaces/default/builder/Open.Design-win-unpacked.zip"
          if (-not (Test-Path $unpackedDir)) {
            Write-Error "win-unpacked dir missing"
            exit 1
          }
          Compress-Archive -Path "$unpackedDir/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Write-Host "ZIP size: $((Get-Item $zipPath).Length / 1MB) MB"
        shell: pwsh

      - name: Normalize artifact filename for GitHub Releases
        # GitHub Releases rewrites spaces in asset names to dots on upload,
        # but electron-builder writes the original filename into latest.yml.
        # That mismatch makes electron-updater 404 when it tries to fetch
        # the .exe. Rename the .exe + patch latest.yml so both agree.
        run: |
          $builderDir = ".tmp/tools-pack/out/win/namespaces/default/builder"
          $oldExe = "$builderDir/Open Design-default-setup.exe"
          $newExe = "$builderDir/Open.Design-default-setup.exe"
          if (-not (Test-Path $oldExe)) {
            Write-Error "Original .exe missing at $oldExe"
            exit 1
          }
          Move-Item $oldExe $newExe
          $latestYml = "$builderDir/latest.yml"
          (Get-Content $latestYml -Raw) `
            -replace 'Open Design-default-setup\.exe', 'Open.Design-default-setup.exe' `
            | Set-Content $latestYml -NoNewline
          Write-Host "=== Patched latest.yml ==="
          Get-Content $latestYml
        shell: pwsh

      - name: Upload as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Open Design Personal v${{ steps.version.outputs.version }} (build #${{ github.run_number }})"
          body: |
            Automated build from commit `${{ github.sha }}`.

            ## Install
            Download `Open.Design-default-setup.exe` below and run it.

            ## Update
            If you already have an installed version, the auto-updater will
            pick this release up within ~30 minutes and prompt you to restart.
          files: |
            .tmp/tools-pack/out/win/namespaces/default/builder/Open.Design-default-setup.exe
            .tmp/tools-pack/out/win/namespaces/default/builder/Open.Design-win-unpacked.zip
            .tmp/tools-pack/out/win/namespaces/default/builder/latest.yml
          generate_release_notes: false
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
