<style>
  .mdb {
    box-sizing: border-box;
    width: 860px;
    margin: 0 auto;
    padding: 34px 40px 38px;
    background: linear-gradient(180deg, #FFFFFF, #F6F6F3);
    border-radius: 30px;
    box-shadow: 0 20px 52px rgba(17, 17, 17, .16);
    font-family: Arial, Helvetica, sans-serif;
    color: #111111;
    display: flex;
    gap: 22px;
  }

  .mdb__col {
    flex: 1;
    border-radius: 20px;
    padding: 22px 24px;
    text-align: center;
  }

  .mdb__col--was {
    background: #FFF1F0;
    box-shadow: inset 0 0 0 2px #FFC7C2;
  }

  .mdb__col--now {
    background: #EEFAF0;
    box-shadow: inset 0 0 0 2px #B7E8C0;
    visibility: hidden;
  }

  .mdb__col--now.is-shown { visibility: visible; }

  .mdb__tag {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #6B6B6B;
  }

  .mdb__val {
    margin-top: 10px;
    font-size: 66px;
    font-weight: 900;
    line-height: 1.05;
  }

  .mdb__col--was .mdb__val { color: #D92D20; text-decoration: line-through; }
  .mdb__col--now .mdb__val { color: #1E9E3E; }
</style>
<div class="mdb">
  <div class="mdb__col mdb__col--was">
    <div class="mdb__tag">БУЛО</div>
    <div class="mdb__val">пів дня</div>
  </div>
  <div class="mdb__col mdb__col--now" data-reveal data-reveal-at="3">
    <div class="mdb__tag">СТАЛО</div>
    <div class="mdb__val">5 хв</div>
  </div>
</div>
