<style>
  .mdl {
    box-sizing: border-box;
    width: 860px;
    margin: 0 auto;
    padding: 34px 44px 38px;
    background: linear-gradient(180deg, #FFFFFF, #F6F6F3);
    border-radius: 30px;
    box-shadow: 0 20px 52px rgba(17, 17, 17, .16);
    font-family: Arial, Helvetica, sans-serif;
    color: #111111;
  }

  .mdl__lead {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .14em;
    color: #6B6B6B;
    text-align: center;
  }

  .mdl__row {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-top: 16px;
    padding: 14px 26px;
    border-radius: 20px;
    background: #FFFFFF;
    box-shadow: 0 8px 22px rgba(17, 17, 17, .10);
    font-size: 52px;
    font-weight: 700;
    /* Стан, а не перехід: кадр знімається одразу після setTime. */
    visibility: hidden;
  }

  .mdl__row.is-shown { visibility: visible; }

  .mdl__dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #0A84FF;
    flex: 0 0 auto;
  }
</style>
<div class="mdl">
  <div class="mdl__lead">ЩО ВСЕРЕДИНІ</div>
  <div class="mdl__row" data-reveal data-reveal-at="2"><span class="mdl__dot"></span>Сценарій</div>
  <div class="mdl__row" data-reveal data-reveal-at="3"><span class="mdl__dot"></span>Озвучка</div>
  <div class="mdl__row" data-reveal data-reveal-at="4"><span class="mdl__dot"></span>Монтаж</div>
</div>
